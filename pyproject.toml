[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-harness"
version = "0.1.0"
description = "Governed coding-agent harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "typer>=0.27.1,<0.28",
    "textual>=8.2,<9",
    "PyYAML>=6.0.3,<7",
    "openai>=2.54,<3",
    "keyring>=25.7,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16.3,<0.17",
    "mypy>=2.3,<3",
]

[project.scripts]
harness = "coding_agent_harness.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
