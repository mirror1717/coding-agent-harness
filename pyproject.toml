[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-agent-harness"
version = "0.1.0"
description = "A governed Python coding agent harness with HITL, Docker sandbox, and tamper-evident audit."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3.0",
    "typer>=0.9,<1.0",
    "textual>=0.40,<1.0",
    "pyyaml>=6.0,<7.0",
    "openai>=1.0,<2.0",
    "keyring>=24.0,<26.0",
    "httpx>=0.25,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-asyncio>=0.21,<1.0",
    "ruff>=0.1.0",
    "mypy>=1.5,<2.0",
]

[project.scripts]
harness = "coding_agent_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
