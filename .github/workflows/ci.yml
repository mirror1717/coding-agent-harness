name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Check Docker
        run: |
          docker version
          docker info

      - name: Build sandbox image
        run: |
          docker build \
            -t coding-agent-harness-sandbox:latest \
            sandbox/

      - name: Verify sandbox image
        run: |
          docker image inspect coding-agent-harness-sandbox:latest
          docker run --rm coding-agent-harness-sandbox:latest \
            python3 -c "import pytest; print('sandbox pytest OK')"

      - name: Run tests
        run: uv run --extra dev python -m pytest

      - name: Ruff
        run: uv run --extra dev python -m ruff check .

      - name: Mypy
        run: uv run --extra dev python -m mypy src

      - name: Diff check
        run: git diff --check
